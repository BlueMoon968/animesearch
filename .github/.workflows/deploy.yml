name: Deploy AnimeSearch to GitHub Pages

on:
  push:
    branches: [ main ]   # o "master" se il branch principale ha quel nome
  workflow_dispatch:      # per lanciarlo a mano dal tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Se in futuro avrai un processo di build (es. npm run build),
      # inseriscilo qui. Per ora prendiamo direttamente i file statici.

      - name: Upload static site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # cartella da pubblicare: radice del repo
          # Se vuoi evitare di caricare .github, puoi usare:
          # path: |
          #   .
          #   !.github/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
